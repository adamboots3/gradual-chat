name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint · types · tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker image boots and answers GraphQL
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the app health check
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:4000/healthz > /dev/null; then
              echo "healthy after ${attempt} attempts"
              exit 0
            fi
            sleep 3
          done
          echo "container did not become healthy"
          docker compose logs --tail 100
          exit 1

      - name: Query GraphQL
        run: |
          response=$(curl -fsS -X POST http://localhost:4000/graphql \
            -H 'content-type: application/json' \
            -d '{"query":"{ __typename }"}')
          echo "$response"
          echo "$response" | grep -q '"__typename":"Query"'

      - name: Tear down
        if: always()
        run: docker compose down -v
