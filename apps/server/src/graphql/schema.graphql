scalar DateTime

type User {
  id: ID!
  name: String!
  username: String!
  avatarColor: String!
  title: String
}

"""
A trimmed-down message used for quote replies and channel previews.
"""
type MessagePreview {
  id: ID!
  body: String!
  author: User!
  createdAt: DateTime!
}

type Message {
  id: ID!
  channelId: ID!
  body: String!
  author: User!
  createdAt: DateTime!
  editedAt: DateTime
  replyTo: MessagePreview
  mentions: [User!]!
}

type Channel {
  id: ID!
  name: String!
  slug: String!
  """
  `channel` for public rooms, `dm` for direct messages.
  """
  type: String!
  memberCount: Int!
  members: [User!]!
  """
  Denormalised unread badge, maintained on every write (see ReadState).
  """
  unreadCount: Int!
  lastMessage: MessagePreview
}

type AuthPayload {
  token: String!
  user: User!
}

type MessagePage {
  messages: [Message!]!
  nextCursor: String
}

input SendMessageInput {
  channelId: ID!
  body: String!
  replyToId: ID
}

type Query {
  me: User
  """
  Typeahead source for the @mention picker.
  """
  users(query: String!): [User!]!
  channels: [Channel!]!
  messages(channelId: ID!, cursor: String, limit: Int): MessagePage!
}

type Mutation {
  login(email: String!, password: String!): AuthPayload!
  sendMessage(input: SendMessageInput!): Message!
  markChannelRead(channelId: ID!, lastMessageId: ID): Channel!
  editMessage(id: ID!, body: String!): Message!
  deleteMessage(id: ID!): Message!
}
